# Load evdi (DisplayLink) and let udev finish creating its devices before X
# starts. displaylink-driver.service loads evdi itself, but it's ordered only
# After=display-manager, so evdi's devices appear ~10ms after Xorg starts
# probing GPUs. X then sees the same devices again as hotplug events, drops
# and re-adds them, and some re-adds fail ("drmSetMaster failed: Device or
# resource busy"). Those DisplayLink heads are gone for the whole session.
[Service]
# Leading "-": machines without the evdi module (no DisplayLink) must still boot.
ExecStartPre=-/sbin/modprobe evdi
ExecStartPre=/usr/bin/udevadm settle
